career-profile:
    title: About
    summary: |
      I'm a teacher, engineer and researcher and active citizen eager to contribute to a better future for all mankind.

      - As a Software Engineer I'm passionate about creating tools which have a positive impact on peoples' lives.
      A tool I created as part of my PhD research is [CEDESK](https://cedesk.github.io).
      - As a University Lecturer I love to transmitting knowledge and mentor students in their carreer development (see Lecturing below).
      - As as Researcher so far I've worked on Model-Based Systems Engineering, as seen on [ResearchGate](https://www.researchgate.net/profile/Dominik_Knoll) and [GoogleScholar](https://scholar.google.com/citations?user=P7yuATMAAAAJ).
      Currently I'm looking for companies with which to collaborate on solving challenging problems.

      In my spare time I engage in promoting a culture of dialogue and universal fraternity with friends of the NGO [New Humanity](https://www.new-humanity.org/en/) and working together on the [United World Project](http://www.unitedworldproject.org/en/).


teaching:
    title: Lecturing
    intro: >
      I'm currently teaching undergraduate courses in computer science in German language at the [Faculy of Mathematics and Computerscience](https://cs.ubbcluj.ro) at the [Babeș-Bolyai University](https://www.ubbcluj.ro) in Cluj-Napoca/Romania.
      Students can contact me via MsTeams and [email](mailto:dominik.knoll@ubbcluj.ro).

    courses:
      - title: Formal Languages and Compilers, 5th semester
        description: Theoretical foundations and implementation of a compiler using Java or C++.
        semesters:
          - semester: Autumn 2020
            link: "https://www.cs.ubbcluj.ro/files/orar/2020-1/disc/MLG5023.html"
          - semester: Autumn 2021
            link: "https://www.cs.ubbcluj.ro/files/orar/2021-1/disc/MLG5023.html"
          - semester: Autumn 2022
            link: "https://www.cs.ubbcluj.ro/files/orar/2022-1/disc/MLG5023.html"

      - title: Object Oriented Programming, 2nd semester
        description: Elementary concepts of OOP and their use in C++, including Design Patterns and Graphical User Interfaces.
        semesters:
          - semester: Spring 2021
            link: "https://www.cs.ubbcluj.ro/files/orar/2020-2/disc/MLG5006.html"
          - semester: Spring 2022
            link: "https://www.cs.ubbcluj.ro/files/orar/2021-2/disc/MLG5006.html"

      - title: Computer Architechture, 1st semester
        description: Information representation, Processor Structure, Assembler programming.
        semesters:
          - semester: Autumn 2021
            link: "https://www.cs.ubbcluj.ro/files/orar/2021-1/disc/MLG5004.html"
          - semester: Autumn 2022
            link: "https://www.cs.ubbcluj.ro/files/orar/2022-1/disc/MLG5004.html"


education:
    - degree: PhD in Engineering Systems
      university: Skoltech
      time: 2014 - 2019
      details: |
        Human collaboration and tool support for Concurrent Conceptual Design and Model Based Systems Engineering.

          - Research on concurrent design methodology and collaborative tool support;
          - Doctoral Thesis “Model-based Processes and Tools for concurrent conceptual design of space systems” [PDF](https://www.skoltech.ru/app/data/uploads/2019/12/thesis25.pdf), [Defense](https://www.skoltech.ru/en/education/phd-defenses/dominik-johannes-knoll/);
          - Managing a 15month industrial research project for a major European Aerospace company about adapting the concurrent design methodology to technology roadmapping;
          - Training in Space Systems Engineering, Entrepreneurship and Innovation;
          - Teaching Assistant in Spacecraft and Mission Design Course, Fall 2015 & Fall 2016;
          - Overseeing the outfitting of the concurrent design facility by external contractors;
          - Setup the IT infrastructure and manage the operations of the concurrent design facility;
          - Participating and conducting feasibility studies for small satellites and electrical power systems;
          - Conduction of several High-Altitude Balloon launch campaigns with communication payloads, winning in Stanford Global Balloon Challenge in 2015;
          - Development of a multiplatform open source data exchange tool for collaborative and concurrent design [CEDESK](https://cedesk.github.io);
          - Collaboration in various research projects and co-authoring several publications.

    - degree: MSc in Applied Computer Science
      university: University of Salzburg
      time: 2004 - 2007
      details: |
          Thesis on autonomous robotics control by neural network trained with reinforcement learning.

          - Specialization natural computing (evolutionary and genetic algorithms, artificial neural networks);
          - Participation in robotics laboratory;
          - Passed with distinction.

    - degree: BSc in Applied Computer Science
      university: University of Salzburg
      time: 2000 - 2003
      details: |
        Designing, building and programming an autonomous robotics platform.


