career-profile:
    title: About
    summary: |
      In general I'm eager to contribute to a better future for all mankind.

      - As a software engineer I'm passionate about creating tools which have a positive impact on peoples' lives.
      - As a university lecturer I love transmitting knowledge and mentoring students in their career development.
      - As as researcher currently I'm bridging Software Engineering and Ethics in IT. In the past I've worked on Model-Based Systems Engineering.

      In my spare time I engage in promoting a culture of dialogue and universal fraternity with friends of the NGO [New Humanity](https://www.new-humanity.org/en/) and working together on the [United World Project](http://www.unitedworldproject.org/en/).


